name: RADV glibc ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radv-glibc.yml'
      - 'scripts/graphics/**'
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install native ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-venv glslang-tools bison flex libelf-dev libvulkan-dev libwayland-dev libwayland-bin libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxrandr-dev libxshmfence-dev
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          "$RUNNER_TEMP/mesa-venv/bin/pip" install meson==1.9.1 ninja==1.11.1.4 mako==1.3.10 packaging==25.0 pyyaml==6.0.2
          echo "$RUNNER_TEMP/mesa-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch exact user-selected branch revision
        run: |
          git init "$RUNNER_TEMP/radv"
          git -C "$RUNNER_TEMP/radv" remote add origin https://github.com/JimVulkan/radv-xclipse.git
          git -C "$RUNNER_TEMP/radv" fetch --depth=1 origin d29b3afcecc542119bd548308a34e8dead6f5655
          git -C "$RUNNER_TEMP/radv" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/radv" rev-parse HEAD)" = d29b3afcecc542119bd548308a34e8dead6f5655
      - name: Build original glibc driver
        run: |
          cd "$RUNNER_TEMP/radv"
          sh build.sh
          mkdir -p "$GITHUB_WORKSPACE/graphics-dist"
          cp dist/*.zip "$GITHUB_WORKSPACE/graphics-dist/"
          readelf -d build-glibc/libvulkan_radeon.so > "$GITHUB_WORKSPACE/graphics-dist/driver-dynamic.txt"
          readelf --version-info build-glibc/libvulkan_radeon.so > "$GITHUB_WORKSPACE/graphics-dist/driver-versions.txt"
          printf '%s\n' d29b3afcecc542119bd548308a34e8dead6f5655 > "$GITHUB_WORKSPACE/graphics-dist/SOURCE_COMMIT"
          cd "$GITHUB_WORKSPACE/graphics-dist"
          sha256sum *.zip > SHA256SUMS
      - name: Build Linux probes
        run: |
          cc -O2 -Wall -Wextra -Werror scripts/graphics/linux-probe.c -o graphics-dist/proroot-graphics-probe $(pkg-config --cflags --libs vulkan wayland-client xcb xcb-dri3)
      - uses: actions/upload-artifact@v4
        with:
          name: radv-glibc-arm64
          path: graphics-dist/
          if-no-files-found: error
