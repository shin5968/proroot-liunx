name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch verified Proroot binaries
        run: bash scripts/fetch-proroot.sh
      - name: Download rootfs extraction test fixture
        run: |
          curl --fail --location --retry 3 'https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-arm64.tar.gz' -o "$RUNNER_TEMP/ubuntu-rootfs.tar.gz"
          echo "a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2  $RUNNER_TEMP/ubuntu-rootfs.tar.gz" | sha256sum --check
      - name: Build and lint
        env:
          ROOTFS_TEST_ARCHIVE: ${{ runner.temp }}/ubuntu-rootfs.tar.gz
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify bundled runtime is unmodified
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for source in pathlib.Path('app/src/main/jniLibs/arm64-v8a').glob('libproroot*.so'):
                  assert hashlib.sha256(apk.read('lib/arm64-v8a/' + source.name)).digest() == hashlib.sha256(source.read_bytes()).digest(), source.name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: proroot-linux-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
