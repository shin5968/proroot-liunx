<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="xterm.css"><style>html,body{margin:0;width:100%;height:100vh;background:#f7f9f6;overflow:hidden}#terminal{position:fixed;inset:4px 4px 0 8px}</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
const lightTheme={background:'#f7f9f6',foreground:'#22352e',cursor:'#174b3a',selectionBackground:'#c4e8d4',black:'#26332e',red:'#a9413c',green:'#174b3a',yellow:'#84602d',blue:'#285f9a',magenta:'#815d91',cyan:'#2c7d72',white:'#e4ebe5',brightBlack:'#6f7c76'};
const darkTheme={background:'#101914',foreground:'#dce9e0',cursor:'#b4dfc9',selectionBackground:'#345a46'};
const terminal=new Terminal({cursorBlink:true,fontSize:14,scrollback:5000,theme:lightTheme});
const fit=new FitAddon.FitAddon();terminal.loadAddon(fit);terminal.open(document.getElementById('terminal'));
terminal.onData(data=>Host.input(data));terminal.onResize(s=>Host.resize(s.cols,s.rows));
window.receive=data=>terminal.write(Uint8Array.from(atob(data),c=>c.charCodeAt(0)));
window.statusLine=text=>terminal.writeln('\r\n'+text);
window.fitTerminal=()=>{const r=document.getElementById('terminal').getBoundingClientRect();if(r.width<20||r.height<20)return;fit.fit();Host.viewportReady(terminal.cols,terminal.rows);};
window.configureTerminal=(fontSize,dark)=>{terminal.options.fontSize=fontSize;terminal.options.theme=dark?darkTheme:lightTheme;document.body.style.background=dark?'#101914':'#f7f9f6';window.fitTerminal();};
new ResizeObserver(()=>window.fitTerminal()).observe(document.getElementById('terminal'));
window.addEventListener('resize',window.fitTerminal);Host.ready();
</script></body></html>
